<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1580" viewBox="0 0 1200 1580" role="img" aria-labelledby="title desc">
<title id="title">How a weak key entered a trusted CA certificate</title>
<desc id="desc">Eight-stage sequence from HSM key generation to a trusted intermediate CA certificate with a recoverable private key.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f4f0ff"/></linearGradient>
 <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#18264b" flood-opacity=".09"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L8,5 L0,10 Z" fill="#6478a8"/></marker>
</defs>
<rect width="1200" height="1580" rx="32" fill="url(#bg)"/>
<text x="60" y="62" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#15264d">How a weak key entered a trusted CA certificate</text>
<text x="60" y="98" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#586985">The failure was not the curve. It was the key-generation and selection process.</text>
<g font-family="Arial,Helvetica,sans-serif">
<g transform="translate(55 130)" filter="url(#shadow)"><rect width="1090" height="135" rx="20" fill="#eaf4ff" stroke="#5aa5ff" stroke-width="2"/><circle cx="42" cy="40" r="25" fill="#3478e5"/><text x="42" y="48" font-size="24" font-weight="700" fill="white" text-anchor="middle">1</text><rect x="80" y="31" width="76" height="70" rx="12" fill="#c6e4ff"/><rect x="91" y="52" width="54" height="35" rx="6" fill="#28486d"/><circle cx="102" cy="63" r="3" fill="#6ce3a3"/><circle cx="102" cy="75" r="3" fill="#6ce3a3"/><text x="118" y="73" font-size="13" font-weight="700" fill="white" text-anchor="middle">HSM</text><text x="185" y="43" font-size="24" font-weight="700" fill="#153568">Normal key-generation ceremony</text><text x="185" y="76" font-size="18" fill="#385477">The CA starts an approved ECC key-generation operation inside the HSM.</text><text x="185" y="103" font-size="18" fill="#385477">Expected outcome: one correctly generated P-384 key pair.</text><rect x="840" y="27" width="220" height="80" rx="13" fill="#d4f8e8"/><text x="860" y="58" font-size="17" font-weight="700" fill="#08764e">EXPECTED STATE</text><text x="860" y="83" font-size="16" fill="#08764e">Secure key material</text></g>
<path d="M600 267 V292" stroke="#6478a8" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(55 300)" filter="url(#shadow)"><rect width="1090" height="135" rx="20" fill="#e9fbf2" stroke="#30bf88" stroke-width="2"/><circle cx="42" cy="40" r="25" fill="#13966a"/><text x="42" y="48" font-size="24" font-weight="700" fill="white" text-anchor="middle">2</text><circle cx="118" cy="68" r="34" fill="#c2f2df"/><text x="118" y="64" font-size="15" font-weight="700" fill="#08764e" text-anchor="middle">P-384</text><path d="M103 79 l11 -11 a8 8 0 1 1 8 8 l-5 5 -5 -5 -5 5z" fill="#08764e"/><text x="185" y="43" font-size="24" font-weight="700" fill="#105b43">Expected ECC key pair created</text><text x="185" y="76" font-size="18" fill="#326957">The HSM produces the intended key pair for the certificate request.</text><text x="185" y="103" font-size="18" fill="#326957">At this point, the expected key is not the reported failure.</text><rect x="840" y="27" width="220" height="80" rx="13" fill="#c9f5e1"/><text x="860" y="58" font-size="17" font-weight="700" fill="#08764e">KEY PAIR 1</text><text x="860" y="83" font-size="16" fill="#08764e">Intended key</text></g>
<path d="M600 437 V462" stroke="#6478a8" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(55 470)" filter="url(#shadow)"><rect width="1090" height="135" rx="20" fill="#fff6df" stroke="#f2b63d" stroke-width="2"/><circle cx="42" cy="40" r="25" fill="#d98b00"/><text x="42" y="48" font-size="24" font-weight="700" fill="white" text-anchor="middle">3</text><circle cx="118" cy="68" r="34" fill="#ffe7ad"/><path d="M100 48 h36 v41 h-36z M106 59 h24 M106 68 h24 M106 77 h18" fill="none" stroke="#a86600" stroke-width="4" stroke-linecap="round"/><text x="185" y="43" font-size="24" font-weight="700" fill="#7c4c00">Wrap/unwrap test deviation</text><text x="185" y="76" font-size="18" fill="#755a2d">A deviation in the key-handling test path introduces unexpected behavior.</text><text x="185" y="103" font-size="18" fill="#755a2d">This should have stopped the ceremony and triggered investigation.</text><rect x="840" y="27" width="220" height="80" rx="13" fill="#ffebbd"/><text x="860" y="58" font-size="17" font-weight="700" fill="#925800">CONTROL GAP</text><text x="860" y="83" font-size="16" fill="#925800">Deviation not contained</text></g>
<path d="M600 607 V632" stroke="#6478a8" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(55 640)" filter="url(#shadow)"><rect width="1090" height="135" rx="20" fill="#fff0f3" stroke="#f05b7a" stroke-width="2"/><circle cx="42" cy="40" r="25" fill="#db3155"/><text x="42" y="48" font-size="24" font-weight="700" fill="white" text-anchor="middle">4</text><circle cx="118" cy="68" r="34" fill="#ffd0db"/><path d="M101 76 l25 -25 a13 13 0 1 1 9 9 l-6 6 -6 -5 -6 6 -5 -4 -7 8z" fill="#b51f40"/><text x="185" y="43" font-size="24" font-weight="700" fill="#9c1735">A second, weak key pair is created</text><text x="185" y="76" font-size="18" fill="#77374a">The process creates another key pair with a dangerously small private scalar.</text><text x="185" y="103" font-size="18" fill="#77374a">For example, a P-384 scalar below 256 has only 256 candidates.</text><rect x="840" y="27" width="220" height="80" rx="13" fill="#ffd8e0"/><text x="860" y="58" font-size="17" font-weight="700" fill="#a21d3c">KEY PAIR 2</text><text x="860" y="83" font-size="16" fill="#a21d3c">Recoverable secret</text></g>
<path d="M600 777 V802" stroke="#6478a8" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(55 810)" filter="url(#shadow)"><rect width="1090" height="135" rx="20" fill="#f2efff" stroke="#9b82ff" stroke-width="2"/><circle cx="42" cy="40" r="25" fill="#7353d6"/><text x="42" y="48" font-size="24" font-weight="700" fill="white" text-anchor="middle">5</text><circle cx="118" cy="68" r="34" fill="#ddd4ff"/><rect x="92" y="48" width="24" height="36" rx="4" fill="white" stroke="#5266ba" stroke-width="3"/><rect x="122" y="48" width="24" height="36" rx="4" fill="white" stroke="#d44b55" stroke-width="3"/><path d="M98 57 h12 M98 64 h12 M128 57 h12 M128 64 h12" stroke="#5266ba" stroke-width="2"/><text x="185" y="43" font-size="24" font-weight="700" fill="#4e3b9b">Similar labels hide the difference</text><text x="185" y="76" font-size="18" fill="#5b5283">The two HSM objects have similar labels or identifiers, obscuring which is intended.</text><text x="185" y="103" font-size="18" fill="#5b5283">Selection relies on naming rather than verified key identity.</text><rect x="840" y="27" width="220" height="80" rx="13" fill="#e2dcff"/><text x="860" y="58" font-size="17" font-weight="700" fill="#4e3b9b">IDENTITY FAILURE</text><text x="860" y="83" font-size="16" fill="#4e3b9b">Wrong object selected</text></g>
<path d="M600 947 V972" stroke="#6478a8" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(55 980)" filter="url(#shadow)"><rect width="1090" height="135" rx="20" fill="#e8fbff" stroke="#39b9d0" stroke-width="2"/><circle cx="42" cy="40" r="25" fill="#087f98"/><text x="42" y="48" font-size="24" font-weight="700" fill="white" text-anchor="middle">6</text><circle cx="118" cy="68" r="34" fill="#c4f3fa"/><rect x="99" y="43" width="38" height="51" rx="5" fill="white" stroke="#087f98" stroke-width="3"/><text x="118" y="62" font-size="12" font-weight="700" fill="#087f98" text-anchor="middle">CSR</text><path d="M108 72 h20 M108 80 h20" stroke="#087f98" stroke-width="2"/><text x="185" y="43" font-size="24" font-weight="700" fill="#075c70">CSR contains the weak public key</text><text x="185" y="76" font-size="18" fill="#326b79">The certificate request is built with the public half of the weak key pair.</text><text x="185" y="103" font-size="18" fill="#326b79">A CSR proves key possession, not that key generation was sound.</text><rect x="840" y="27" width="220" height="80" rx="13" fill="#cef6fb"/><text x="860" y="58" font-size="17" font-weight="700" fill="#075c70">BAD INPUT</text><text x="860" y="83" font-size="16" fill="#075c70">Weak public key</text></g>
<path d="M600 1117 V1142" stroke="#6478a8" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(55 1150)" filter="url(#shadow)"><rect width="1090" height="135" rx="20" fill="#eaf3ff" stroke="#579bfa" stroke-width="2"/><circle cx="42" cy="40" r="25" fill="#2768c8"/><text x="42" y="48" font-size="24" font-weight="700" fill="white" text-anchor="middle">7</text><circle cx="118" cy="68" r="34" fill="#cce1ff"/><rect x="99" y="43" width="38" height="51" rx="5" fill="white" stroke="#2768c8" stroke-width="3"/><path d="M107 55 h22 M107 63 h22 M107 71 h18" stroke="#2768c8" stroke-width="2"/><circle cx="132" cy="86" r="9" fill="#2768c8"/><text x="185" y="43" font-size="24" font-weight="700" fill="#174c9a">Root signs the intermediate certificate</text><text x="185" y="76" font-size="18" fill="#365c8b">The root correctly signs a certificate containing the weak public key.</text><text x="185" y="103" font-size="18" fill="#365c8b">The chain can look cryptographically valid to relying parties.</text><rect x="840" y="27" width="220" height="80" rx="13" fill="#d7e8ff"/><text x="860" y="58" font-size="17" font-weight="700" fill="#174c9a">VALID SIGNATURE</text><text x="860" y="83" font-size="16" fill="#174c9a">Unsafe key certified</text></g>
<path d="M600 1287 V1312" stroke="#6478a8" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(55 1320)" filter="url(#shadow)"><rect width="1090" height="180" rx="20" fill="#ffedf0" stroke="#e83d56" stroke-width="3"/><circle cx="42" cy="40" r="25" fill="#c81e3a"/><text x="42" y="48" font-size="24" font-weight="700" fill="white" text-anchor="middle">8</text><circle cx="118" cy="79" r="34" fill="#ffcbd4"/><rect x="96" y="57" width="44" height="42" rx="6" fill="white" stroke="#b91d37" stroke-width="3"/><path d="M108 76 v-7 a10 10 0 0 1 20 0 v7 M106 76 h24 v15 h-24z" fill="none" stroke="#b91d37" stroke-width="3"/><text x="185" y="42" font-size="23" font-weight="700" fill="#a31630">Trusted certificate, recoverable private key</text><text x="185" y="78" font-size="18" fill="#783846">Outsiders can search the tiny scalar space and recover the intermediate key.</text><text x="185" y="108" font-size="18" fill="#783846">The CA's signature is valid, but trust in certificates issued with this</text><text x="185" y="135" font-size="18" fill="#783846">key is undermined. Certificate validity did not validate key quality.</text><rect x="840" y="43" width="220" height="92" rx="13" fill="#ffd5dc"/><text x="860" y="74" font-size="17" font-weight="700" fill="#a31630">TRUST FAILURE</text><text x="860" y="99" font-size="16" fill="#a31630">CA signing capability</text><text x="860" y="120" font-size="16" fill="#a31630">can be impersonated</text></g>
<text x="60" y="1540" font-size="16" fill="#65718a">Key lesson: a valid chain proves signatures and constraints—not that the private key was generated securely.</text>
</g></svg>