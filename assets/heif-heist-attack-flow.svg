<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
  <title id="title">HEIF Heist attack path</title>
  <desc id="desc">A crafted HEIF image triggers a libheif heap overflow and forum code execution. A separate SSO flaw enables employee account impersonation, and an existing Codex GitHub integration allows an internal pull request.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5b6472"/></marker>
    <style>
      .node { fill:#f7f8fa; stroke:#697586; stroke-width:1.5; }
      .vuln { fill:#fff0e8; stroke:#bd5b28; stroke-width:1.8; }
      .auth { fill:#edf4ff; stroke:#3768a6; stroke-width:1.8; }
      .result { fill:#eaf7ef; stroke:#347a50; stroke-width:1.8; }
      .heading { font: 600 17px system-ui, sans-serif; fill:#182230; text-anchor:middle; }
      .detail { font: 14px system-ui, sans-serif; fill:#3d4755; text-anchor:middle; }
      .edge { stroke:#5b6472; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .label { font: 13px system-ui, sans-serif; fill:#596273; }
    </style>
  </defs>
  <rect x="20" y="20" width="960" height="570" rx="18" fill="#ffffff" stroke="#d9dee7"/>
  <text x="500" y="54" class="heading" font-size="20">From image upload to repository action</text>
  <rect x="65" y="92" width="250" height="76" rx="12" class="node"/>
  <text x="190" y="122" class="heading">Crafted HEIF upload</text><text x="190" y="145" class="detail">Untrusted image container</text>
  <path d="M315 130 H365" class="edge"/>
  <rect x="370" y="92" width="260" height="76" rx="12" class="vuln"/>
  <text x="500" y="122" class="heading">libheif heap overflow</text><text x="500" y="145" class="detail">Malformed overlay offsets</text>
  <path d="M630 130 H680" class="edge"/>
  <rect x="685" y="92" width="250" height="76" rx="12" class="vuln"/>
  <text x="810" y="122" class="heading">Forum code execution</text><text x="810" y="145" class="detail">Discourse environment</text>
  <path d="M810 168 V220 H690" class="edge"/>
  <text x="738" y="207" class="label">identity boundary</text>
  <rect x="435" y="235" width="250" height="76" rx="12" class="vuln"/>
  <text x="560" y="265" class="heading">OpenAI SSO flaw</text><text x="560" y="288" class="detail">Relying-party compromise</text>
  <path d="M435 273 H365" class="edge"/>
  <rect x="75" y="235" width="285" height="76" rx="12" class="auth"/>
  <text x="217" y="265" class="heading">Employee identity</text><text x="217" y="288" class="detail">ChatGPT / Codex impersonation</text>
  <path d="M217 311 V365" class="edge"/>
  <text x="230" y="344" class="label">existing authorization</text>
  <rect x="75" y="370" width="285" height="76" rx="12" class="auth"/>
  <text x="217" y="400" class="heading">Codex GitHub integration</text><text x="217" y="423" class="detail">Pre-existing organization access</text>
  <path d="M360 408 H435" class="edge"/>
  <rect x="440" y="370" width="280" height="76" rx="12" class="result"/>
  <text x="580" y="400" class="heading">Internal pull request</text><text x="580" y="423" class="detail">Proof of repository access</text>
  <rect x="75" y="490" width="850" height="55" rx="10" fill="#f3f5f8" stroke="#d9dee7"/>
  <text x="500" y="513" class="heading">Three distinct boundaries</text>
  <text x="500" y="533" class="detail">Native parser safety • SSO identity trust • authorized repository actions</text>
</svg>