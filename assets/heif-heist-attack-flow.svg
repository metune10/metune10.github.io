<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc">
  <title id="title">HEIF Heist: attack chain from upload to repository action</title>
  <desc id="desc">One connected vertical attack chain: crafted HEIF upload leads to libheif heap overflow, forum remote code execution, exploitation of a separate OpenAI SSO token-permission flaw, employee ChatGPT and Codex account takeover, use of the existing Codex GitHub integration, and an internal pull request.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#475569"/>
    </marker>
    <style>
      .box { stroke-width:1.8; }
      .normal { fill:#f8fafc; stroke:#64748b; }
      .vuln { fill:#fff1e8; stroke:#c05a2b; }
      .identity { fill:#edf4ff; stroke:#3768a6; }
      .impact { fill:#eaf7ef; stroke:#347a50; }
      .heading { font:600 19px system-ui,sans-serif; fill:#182230; text-anchor:middle; }
      .detail { font:15px system-ui,sans-serif; fill:#374151; text-anchor:middle; }
      .arrow { fill:none; stroke:#475569; stroke-width:2.8; marker-end:url(#arrow); }
      .label { font:600 13px system-ui,sans-serif; fill:#475569; text-anchor:start; }
      .small { font:13px system-ui,sans-serif; fill:#5b6472; text-anchor:middle; }
    </style>
  </defs>
  <rect x="20" y="20" width="960" height="780" rx="18" fill="#ffffff" stroke="#d9dee7"/>
  <text x="500" y="55" class="heading" font-size="22">From HEIF upload to internal repository action</text>

  <rect x="170" y="82" width="660" height="68" rx="12" class="box normal"/>
  <text x="500" y="109" class="heading">1. Crafted HEIF upload</text>
  <text x="500" y="132" class="detail">Attacker-controlled image submitted to community.openai.com</text>

  <path d="M500 150 V181" class="arrow"/>

  <rect x="170" y="185" width="660" height="68" rx="12" class="box vuln"/>
  <text x="500" y="212" class="heading">2. libheif heap overflow</text>
  <text x="500" y="235" class="detail">Malformed overlay offsets cause out-of-bounds access</text>

  <path d="M500 253 V284" class="arrow"/>

  <rect x="170" y="288" width="660" height="68" rx="12" class="box vuln"/>
  <text x="500" y="315" class="heading">3. Remote code execution on Discourse</text>
  <text x="500" y="338" class="detail">Initial foothold in the forum's execution environment</text>

  <path d="M500 356 V389" class="arrow"/>
  <text x="520" y="378" class="label">foothold used to reach the separate identity flaw</text>

  <rect x="170" y="393" width="660" height="88" rx="12" class="box vuln"/>
  <text x="500" y="420" class="heading">4. Separate OpenAI SSO token-permission flaw</text>
  <text x="500" y="444" class="detail">Community sign-in tokens had permissions reaching</text>
  <text x="500" y="464" class="detail">ChatGPT / Codex APIs; RCE alone was not account takeover</text>

  <path d="M500 481 V512" class="arrow"/>
  <text x="520" y="502" class="label">identity boundary crossed</text>

  <rect x="170" y="516" width="660" height="68" rx="12" class="box identity"/>
  <text x="500" y="543" class="heading">5. Employee ChatGPT / Codex account takeover</text>
  <text x="500" y="566" class="detail">Compromised identity carries the employee's existing privileges</text>

  <path d="M500 584 V615" class="arrow"/>
  <text x="520" y="605" class="label">existing delegated authorization</text>

  <rect x="170" y="619" width="660" height="68" rx="12" class="box identity"/>
  <text x="500" y="646" class="heading">6. Existing Codex–GitHub integration</text>
  <text x="500" y="669" class="detail">Authorized connection to OpenAI's GitHub organization</text>

  <path d="M500 687 V718" class="arrow"/>

  <rect x="170" y="722" width="660" height="56" rx="12" class="box impact"/>
  <text x="500" y="746" class="heading">7. Internal pull request in openai/openai</text>
  <text x="500" y="766" class="small">Reported as harmless proof of repository access</text>
</svg>