<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc">
  <title id="title">RefJinja command execution flow</title>
  <desc id="desc">An attacker-controlled ReferenceFileSystem descriptor reaches unsafe Jinja2 evaluation during dataset processing, which triggers an operating-system command running with the worker process permissions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="690" rx="18" fill="#f8fafc"/>
  <text x="48" y="48" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a">RefJinja: descriptor to command execution</text>
  <text x="48" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">Conceptual attack path in the dataset-processing worker</text>
  <rect x="120" y="105" width="760" height="78" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="500" y="137" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#9a3412">1 · Attacker-controlled input</text>
  <text x="500" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#7c2d12">ReferenceFileSystem descriptor</text>
  <path d="M500 183 V215" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="120" y="225" width="760" height="78" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="500" y="257" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">2 · Dataset processing</text>
  <text x="500" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1e40af">Descriptor metadata reaches the renderer</text>
  <path d="M500 303 V335" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="120" y="345" width="760" height="78" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="377" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#b91c1c">3 · Unsafe Jinja2 evaluation</text>
  <text x="500" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#991b1b">Untrusted expression is evaluated as template logic</text>
  <path d="M500 423 V455" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="120" y="465" width="760" height="78" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="497" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#b91c1c">4 · Operating-system command executes</text>
  <text x="500" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#991b1b">Runs with the dataset-server worker's permissions</text>
  <rect x="120" y="575" width="760" height="68" rx="12" fill="#7f1d1d"/>
  <text x="500" y="603" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">IMPACT</text>
  <text x="500" y="625" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ffffff">Command execution within the worker's privilege boundary</text>
</svg>