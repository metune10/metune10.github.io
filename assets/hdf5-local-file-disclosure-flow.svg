<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc">
  <title id="title">HDF5 local-file disclosure flow</title>
  <desc id="desc">Attacker-controlled HDF5 metadata is parsed by Dataset Viewer. External-storage metadata points to a local file the worker can access. The worker reads it and the first-rows endpoint returns the data.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect width="1000" height="690" rx="18" fill="#f8fafc"/>
  <text x="48" y="48" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a">HDF5: local-file disclosure</text>
  <text x="48" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">How untrusted dataset metadata can expose files readable by the worker</text>
  <rect x="120" y="105" width="760" height="78" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="500" y="137" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#9a3412">1 · Attacker-controlled input</text>
  <text x="500" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#7c2d12">HDF5 metadata contains external-storage references</text>
  <path d="M500 183 V215" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="120" y="225" width="760" height="78" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="500" y="257" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">2 · Dataset Viewer parses the dataset</text>
  <text x="500" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1e40af">The loader follows the external-storage metadata</text>
  <path d="M500 303 V335" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="120" y="345" width="760" height="78" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="377" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#b91c1c">3 · Worker reads a local file</text>
  <text x="500" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#991b1b">Referenced path is accessible to the worker process</text>
  <path d="M500 423 V455" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="120" y="465" width="760" height="78" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="497" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#b91c1c">4 · Preview response exposes the data</text>
  <text x="500" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#991b1b">/first-rows returns data read by the worker</text>
  <rect x="120" y="575" width="760" height="68" rx="12" fill="#7f1d1d"/>
  <text x="500" y="603" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">IMPACT</text>
  <text x="500" y="625" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ffffff">Local-file disclosure (not command execution)</text>
</svg>